name: Testes do MCP
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          for file in src/*.mjs; do node --check "$file"; done
      - name: Verificar sintaxe do deploy remoto
        run: bash -n scripts/deploy-mcp-remote.sh
      - name: Executar teste de integracao
        run: npm test
