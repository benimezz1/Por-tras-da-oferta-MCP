name: Deploy MCP em producao

# PRs nao tem acesso a producao. Merge na main + CI aprovada dispara deploy.
on:
  workflow_run:
    workflows: ["Testes do MCP"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mcp.portrasdaoferta.workers.dev/health
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ secrets.MCP_DEPLOY_HOST }}
      DEPLOY_USER: pto-ghdeploy
      DEPLOY_KEY: ${{ secrets.MCP_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.MCP_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.MCP_DEPLOY_PORT || '22' }}
      MCP_PUBLIC_ORIGIN: https://mcp.portrasdaoferta.workers.dev
      C4_GAME_ORIGIN: https://jogo.portrasdaoferta.workers.dev

    steps:
      - name: Baixar codigo aprovado
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Conferir credenciais e preparar SSH restrito
        shell: bash
        run: |
          set -euo pipefail
          for var in DEPLOY_HOST DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Falta $var no environment production."
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::SHA ou host SSH invalido."
            exit 1
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::Porta SSH invalida."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"

          # Secrets de varias linhas sao facilmente corrompidos em copiar/colar.
          # A forma recomendada e um unico valor base64 da chave PRIVADA.
          # Para retrocompatibilidade, uma chave PEM/OpenSSH multiline valida
          # continua sendo aceita.
          key_file="$HOME/.ssh/pto_deploy"
          if [[ "$DEPLOY_KEY" == -----BEGIN* ]]; then
            printf '%s\n' "$DEPLOY_KEY" | sed 's/\r$//' > "$key_file"
          else
            if ! printf '%s' "$DEPLOY_KEY" | base64 --decode > "$key_file" 2>/dev/null; then
              echo "::error::Chave SSH invalida: secret deve conter base64 da chave privada (base64 -w 0 arquivo)."
              exit 1
            fi
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$key_file" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$key_file" >/dev/null 2>&1; then
            echo "::error::Chave SSH invalida. Regrave MCP_DEPLOY_SSH_KEY com a saida base64 -w 0 do arquivo privado da EC2."
            exit 1
          fi
          lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$lookup" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "::error::Host nao encontrado no known_hosts verificado."
            exit 1
          }
          for file in scripts/pto-ssh-gate.sh scripts/pto-deploy-systemd.sh scripts/bootstrap-pto-ssh.sh; do
            bash -n "$file"
          done

      - name: Implantar SOMENTE o servico por-tras-da-oferta
        shell: bash
        run: |
          set -euo pipefail
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT
          ssh -T -F /dev/null -i "$HOME/.ssh/pto_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $DEPLOY_SHA" | tee "$result"
          grep -Fxq "DEPLOY_COMPLETE $DEPLOY_SHA" "$result" || {
            echo "::error::Servico remoto nao confirmou o commit instalado."
            exit 1
          }

      - name: Confirmar HTTPS e CORS reais no dominio publico
        shell: bash
        run: |
          set -euo pipefail
          base="$MCP_PUBLIC_ORIGIN"
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$base/health" > /dev/null
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$base/api/c4/client/signup" \
            -H "Origin: $C4_GAME_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type')"
          if [[ "$status" != "204" ]] || ! tr -d '\r' < "$headers" | grep -Fiqx "Access-Control-Allow-Origin: $C4_GAME_ORIGIN"; then
            echo "::error::Preflight CORS publico falhou (HTTP $status)."
            cat "$headers"
            exit 1
          fi
          status="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' \
            "$base/api/c4/client/me" -H "Origin: $C4_GAME_ORIGIN")"
          if [[ "$status" != "401" ]] || ! tr -d '\r' < "$headers" | grep -Fiqx "Access-Control-Allow-Origin: $C4_GAME_ORIGIN"; then
            echo "::error::API C4 sem CORS permitido (HTTP $status)."
            cat "$headers"
            exit 1
          fi
          echo "### MCP publicado com sucesso" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Servico: por-tras-da-oferta.service (porta 3201)" >> "$GITHUB_STEP_SUMMARY"
          echo "- CORS signup OPTIONS 204 e /me 401: OK" >> "$GITHUB_STEP_SUMMARY"
